name: Apply FD Work deadline contract fix

on:
  push:
    branches:
      - fix/runtime-reliability-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-reliability-followup
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-release.txt
      - name: Patch passive deadline inheritance
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("worktrace/integrations/fd_work/window_controller.py")
          text = path.read_text(encoding="utf-8")
          old = '            self._probe_deadline = self._clock() + self._work_shell_timeout_seconds\n'
          new = (
              '            if self._probe_deadline is None:\n'
              '                self._probe_deadline = self._clock() + (\n'
              '                    self._work_shell_timeout_seconds\n'
              '                    if self._explicit_activation\n'
              '                    else self._passive_probe_timeout_seconds\n'
              '                )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"deadline patch target count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch_fd_deadline.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\patch_fd_deadline.py"
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt -c constraints-release.txt
      - name: Run FD Work controller regression tests
        shell: pwsh
        run: python -m pytest -q tests/test_fd_work_window_controller.py tests/test_fd_work_startup_probe_contract.py
      - name: Commit fix and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ".github/workflows/agent-fd-deadline-fix.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve bounded FD Work probe deadlines"
          git push origin HEAD:fix/runtime-reliability-followup
