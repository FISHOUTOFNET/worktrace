name: Repair performance fix CI

on:
  push:
    branches:
      - codex/fd-work-entry
    paths:
      - .github/workflows/_repair_perf_ci.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fd-work-entry
          fetch-depth: 0

      - name: Restore ownership contract shape and sync asset revisions
        shell: python
        run: |
          from pathlib import Path

          path = Path("worktrace/webview_ui/js/init_fd_work_v5.js")
          text = path.read_text(encoding="utf-8")
          old = '''        refreshActivePage(\n            App.lastRefreshState,\n            {\n                navigation: true,\n                preservePresentation: pageId === "statistics"\n            },\n            pageId\n        ).catch(function () {\n            App.showError("刷新失败");\n        });'''
          new = '''        refreshActivePage(App.lastRefreshState, {\n            navigation: true,\n            preservePresentation: pageId === "statistics"\n        }, pageId).catch(function () {\n            App.showError("刷新失败");\n        });'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one switchPage replacement, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Synchronize WebView content revisions
        run: python scripts/sync_webview_asset_revisions.py --write

      - name: Validate repaired contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          init = Path("worktrace/webview_ui/js/init_fd_work_v5.js").read_text(encoding="utf-8")
          assert "refreshActivePage(App.lastRefreshState" in init
          assert 'preservePresentation: pageId === "statistics"' in init
          PY
          python scripts/sync_webview_asset_revisions.py --check
          node --check worktrace/webview_ui/js/init_fd_work_v5.js
          git diff --check

      - name: Commit CI repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worktrace/webview_ui/js/init_fd_work_v5.js worktrace/webview_ui/index_fd_work_v5.html
          git commit -m "fix: align navigation perf changes with frontend contracts"
          git push origin HEAD:codex/fd-work-entry
