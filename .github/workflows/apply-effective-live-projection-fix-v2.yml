name: Apply effective live projection fix v2

on:
  push:
    branches: [fix/pre-release-ui-interaction-lifecycle]
    paths:
      - .github/workflows/apply-effective-live-projection-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pre-release-ui-interaction-lifecycle
          fetch-depth: 0
      - name: Execute corrected source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-effective-live-projection-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          python -m compileall"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('unable to locate staged patch script')
          script = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script).replace('docs/architecture.md', 'architecture.md')
          Path('/tmp/apply_effective_projection_patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_effective_projection_patch.py
          python -m compileall -q worktrace tests/test_effective_live_projection.py
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "worktrace-ci"
          git config user.email "actions@users.noreply.github.com"
          git add worktrace/services/page_read_context.py \
            worktrace/services/report_fact_query_service.py \
            worktrace/services/report_session_builder.py \
            worktrace/services/report_projection_builder.py \
            worktrace/services/report_effective_projection_service.py \
            worktrace/services/report_projection_provider.py \
            worktrace/services/statistics_realtime_summary.py \
            worktrace/services/view_model_service.py \
            architecture.md \
            tests/test_effective_live_projection.py
          git diff --cached --stat
          git commit -m "fix: project verified live session topology"
          git push origin HEAD:fix/pre-release-ui-interaction-lifecycle
