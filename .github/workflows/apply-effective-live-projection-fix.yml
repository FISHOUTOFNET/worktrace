name: Apply effective live projection fix

on:
  push:
    branches: [fix/pre-release-ui-interaction-lifecycle]
    paths:
      - .github/workflows/apply-effective-live-projection-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pre-release-ui-interaction-lifecycle
          fetch-depth: 0
      - name: Apply architecture patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, repl):
              text = read(path)
              updated, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex replacement count={count}: {pattern[:100]!r}")
              write(path, updated)

          # PageReadContext owns request-local effective projections separately
          # from durable day projections.
          replace_once(
              "worktrace/services/page_read_context.py",
              '    snapshot_cache: dict[tuple[str, str], Any] = field(default_factory=dict)\n    day_projection_cache: dict[str, Any] = field(default_factory=dict)\n',
              '    snapshot_cache: dict[tuple[str, str], Any] = field(default_factory=dict)\n    day_projection_cache: dict[str, Any] = field(default_factory=dict)\n    effective_day_projection_cache: dict[str, Any] = field(default_factory=dict)\n',
          )

          # Fact query accepts an injected, verified read-time duration override.
          replace_once(
              "worktrace/services/report_fact_query_service.py",
              'from __future__ import annotations\n\nfrom datetime import date as date_type, datetime, time as datetime_time, timedelta\n',
              'from __future__ import annotations\n\nfrom collections.abc import Mapping\nfrom datetime import date as date_type, datetime, time as datetime_time, timedelta\n',
          )
          replace_once(
              "worktrace/services/report_fact_query_service.py",
              'def load_report_activity_rows(\n    start_date: str,\n    end_date: str,\n    *,\n    conn=None,\n) -> list[dict]:',
              'def load_report_activity_rows(\n    start_date: str,\n    end_date: str,\n    *,\n    conn=None,\n    duration_overrides: Mapping[int, int] | None = None,\n) -> list[dict]:',
          )
          replace_once(
              "worktrace/services/report_fact_query_service.py",
              '                end_date,\n                conn=read_conn,\n            )',
              '                end_date,\n                conn=read_conn,\n                duration_overrides=duration_overrides,\n            )',
          )
          replace_once(
              "worktrace/services/report_fact_query_service.py",
              '    rows = _load_fact_rows(conn, start_date, end_date, carry_seconds=carry_seconds)\n',
              '    rows = _load_fact_rows(\n        conn,\n        start_date,\n        end_date,\n        carry_seconds=carry_seconds,\n        duration_overrides=duration_overrides,\n    )\n',
          )
          replace_once(
              "worktrace/services/report_fact_query_service.py",
              'def _load_fact_rows(\n    conn,\n    start_date: str,\n    end_date: str,\n    *,\n    carry_seconds: int = 0,\n) -> list[dict]:',
              'def _load_fact_rows(\n    conn,\n    start_date: str,\n    end_date: str,\n    *,\n    carry_seconds: int = 0,\n    duration_overrides: Mapping[int, int] | None = None,\n) -> list[dict]:',
          )
          replace_once(
              "worktrace/services/report_fact_query_service.py",
              '    for raw in raw_rows:\n        row = dict(raw)\n        _attach_resource_fields(row)\n',
              '    for raw in raw_rows:\n        row = dict(raw)\n        activity_id = int(row.get("id") or 0)\n        if duration_overrides is not None and activity_id in duration_overrides:\n            row["duration_seconds"] = max(\n                0,\n                int(duration_overrides[activity_id]),\n            )\n        _attach_resource_fields(row)\n',
          )

          # The canonical compaction kernel may admit exactly one verified open
          # activity for read projection. Durable callers keep the default 0.
          replace_once(
              "worktrace/services/report_session_builder.py",
              '    unrecorded_gap_boundary_seconds: int = DEFAULT_UNRECORDED_GAP_BOUNDARY_SECONDS,\n    max_interruption_seconds: int = SHORT_PROJECT_RETURN_MERGE_SECONDS,\n) -> list[dict]:',
              '    unrecorded_gap_boundary_seconds: int = DEFAULT_UNRECORDED_GAP_BOUNDARY_SECONDS,\n    max_interruption_seconds: int = SHORT_PROJECT_RETURN_MERGE_SECONDS,\n    effective_open_activity_id: int = 0,\n) -> list[dict]:',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '    interval_source = tuple(dict(row) for row in interval_rows)\n    result: list[dict] = []\n',
              '    interval_source = tuple(dict(row) for row in interval_rows)\n    effective_open_id = max(0, int(effective_open_activity_id or 0))\n    result: list[dict] = []\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '        if not _is_short_return_anchor(current):\n',
              '        if not _is_short_return_anchor(current, effective_open_id):\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '                if bool(candidate.get("is_in_progress")):\n                    break\n                if _same_concrete_project(current, candidate):\n',
              '                if (\n                    bool(candidate.get("is_in_progress"))\n                    and not _session_contains_activity(candidate, effective_open_id)\n                ):\n                    break\n                if _same_concrete_project(\n                    current,\n                    candidate,\n                    effective_open_id,\n                ):\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '                if _is_short_return_anchor(candidate):\n',
              '                if _is_short_return_anchor(candidate, effective_open_id):\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '            current = _merge_short_return_group(group)\n',
              '            current = _merge_short_return_group(group, effective_open_id)\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '        window_threshold_seconds=window_threshold,\n    )\n\n\ndef _build_session',
              '        window_threshold_seconds=window_threshold,\n        effective_open_activity_id=effective_open_id,\n    )\n\n\ndef _build_session',
          )

          regex_once(
              "worktrace/services/report_session_builder.py",
              r'def _is_short_return_anchor\(session: Mapping\) -> bool:\n.*?\n\ndef _is_short_uncategorized_bridge',
              '''def _session_contains_activity(\n    session: Mapping,\n    activity_id: int,\n) -> bool:\n    if int(activity_id or 0) <= 0:\n        return False\n    if int(session.get("open_activity_id") or 0) == int(activity_id):\n        return True\n    return int(activity_id) in {\n        int(value or 0) for value in session.get("activity_ids") or []\n    }\n\n\ndef _is_short_return_anchor(\n    session: Mapping,\n    effective_open_activity_id: int = 0,\n) -> bool:\n    return bool(\n        str(session.get("row_kind") or "project_session") == "project_session"\n        and bool(session.get("is_report_project"))\n        and int(session.get("project_id") or 0) > 0\n        and not bool(session.get("project_is_deleted"))\n        and (\n            not bool(session.get("is_in_progress"))\n            or _session_contains_activity(session, effective_open_activity_id)\n        )\n    )\n\n\ndef _is_short_uncategorized_bridge''',
          )
          regex_once(
              "worktrace/services/report_session_builder.py",
              r'def _is_short_concrete_bridge\(\n    session: Mapping,\n    foreign_threshold_seconds: int,\n\) -> bool:\n.*?\n\ndef _same_concrete_project\(left: Mapping, right: Mapping\) -> bool:\n.*?\n\ndef _session_gap_seconds',
              '''def _is_short_concrete_bridge(\n    session: Mapping,\n    foreign_threshold_seconds: int,\n) -> bool:\n    # A bridge is necessarily bounded by a right neighbour, so it must be\n    # closed. Only the left/right anchors may use the verified open override.\n    return bool(\n        _is_short_return_anchor(session)\n        and max(0, int(session.get("duration_seconds") or 0))\n        <= max(0, int(foreign_threshold_seconds))\n    )\n\n\ndef _same_concrete_project(\n    left: Mapping,\n    right: Mapping,\n    effective_open_activity_id: int = 0,\n) -> bool:\n    return bool(\n        _is_short_return_anchor(left, effective_open_activity_id)\n        and bool(right.get("is_report_project"))\n        and int(right.get("project_id") or 0) == int(left.get("project_id") or 0)\n        and not bool(right.get("project_is_deleted"))\n        and (\n            not bool(right.get("is_in_progress"))\n            or _session_contains_activity(right, effective_open_activity_id)\n        )\n    )\n\n\ndef _session_gap_seconds''',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              'def _merge_short_return_group(group: Sequence[Mapping]) -> dict:\n',
              'def _merge_short_return_group(\n    group: Sequence[Mapping],\n    effective_open_activity_id: int = 0,\n) -> dict:\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '    if not _same_concrete_project(first, last):\n',
              '    if not _same_concrete_project(first, last, effective_open_activity_id):\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '    duration = max(0, int(duration_seconds))\n    merged.update(\n',
              '    duration = max(0, int(duration_seconds))\n    is_in_progress = bool(last.get("is_in_progress"))\n    live_component_seconds = (\n        max(\n            0,\n            int(last.get("duration_seconds") or 0)\n            - int(last.get("closed_duration_seconds") or 0),\n        )\n        if is_in_progress\n        else 0\n    )\n    closed_duration_seconds = max(0, duration - live_component_seconds)\n    open_activity_id = (\n        int(last.get("open_activity_id") or 0) if is_in_progress else 0\n    )\n    merged.update(\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '            "closed_duration_seconds": duration,\n            "open_activity_id": 0,\n',
              '            "closed_duration_seconds": closed_duration_seconds,\n            "open_activity_id": open_activity_id,\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '            "editable": all(bool(item.get("editable", True)) for item in group),\n            "exportable": all(bool(item.get("exportable", True)) for item in group),\n            "is_in_progress": False,\n',
              '            "editable": (\n                False\n                if is_in_progress\n                else all(bool(item.get("editable", True)) for item in group)\n            ),\n            "exportable": (\n                False\n                if is_in_progress\n                else all(bool(item.get("exportable", True)) for item in group)\n            ),\n            "is_in_progress": is_in_progress,\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '    foreign_threshold_seconds: int,\n    window_threshold_seconds: int,\n) -> list[dict]:',
              '    foreign_threshold_seconds: int,\n    window_threshold_seconds: int,\n    effective_open_activity_id: int = 0,\n) -> list[dict]:',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '        if not (_is_short_return_anchor(left) and _is_short_return_anchor(right)):\n',
              '        if not (\n            _is_short_return_anchor(left, effective_open_activity_id)\n            and _is_short_return_anchor(right, effective_open_activity_id)\n        ):\n',
          )
          replace_once(
              "worktrace/services/report_session_builder.py",
              '        if is_concrete_bridge and _same_concrete_project(left, right):\n',
              '        if is_concrete_bridge and _same_concrete_project(\n            left,\n            right,\n            effective_open_activity_id,\n        ):\n',
          )

          # Builder keeps durable and effective entry points separate while
          # sharing the exact same business pipeline.
          insert = '''\n\n@dataclass(frozen=True, slots=True)\nclass VerifiedOpenProjectionOverride:\n    """Verified request-local duration for the single persisted open activity."""\n\n    activity_id: int\n    duration_seconds: int\n\n    def __post_init__(self) -> None:\n        if int(self.activity_id) <= 0:\n            raise ValueError("effective_projection_requires_open_activity")\n        if int(self.duration_seconds) < 0:\n            raise ValueError("effective_projection_requires_nonnegative_duration")\n'''
          replace_once(
              "worktrace/services/report_projection_builder.py",
              '\n\ndef compute_projection_snapshot_revision(\n',
              insert + '\n\ndef compute_projection_snapshot_revision(\n',
          )
          replace_once(
              "worktrace/services/report_projection_builder.py",
              'def compute_projection(\n    conn,\n    start_date: str,\n    end_date: str,\n) -> ProjectionComputation:\n    """Run the single projection computation path and return raw results.\n',
              '''def compute_projection(\n    conn,\n    start_date: str,\n    end_date: str,\n) -> ProjectionComputation:\n    """Return durable projection semantics; runtime state is never consulted."""\n    return _compute_projection(conn, start_date, end_date)\n\n\ndef compute_effective_read_projection(\n    conn,\n    start_date: str,\n    end_date: str,\n    verified_open_override: VerifiedOpenProjectionOverride,\n) -> ProjectionComputation:\n    """Return request-local as-of structure using one verified open duration."""\n    return _compute_projection(\n        conn,\n        start_date,\n        end_date,\n        verified_open_override=verified_open_override,\n    )\n\n\ndef _compute_projection(\n    conn,\n    start_date: str,\n    end_date: str,\n    *,\n    verified_open_override: VerifiedOpenProjectionOverride | None = None,\n) -> ProjectionComputation:\n    """Run the single projection computation path and return raw results.\n''',
          )
          replace_once(
              "worktrace/services/report_projection_builder.py",
              '        rows = load_report_activity_rows(\n            start_date,\n            end_date,\n            conn=conn,\n        )\n',
              '        duration_overrides = (\n            {\n                int(verified_open_override.activity_id): int(\n                    verified_open_override.duration_seconds\n                )\n            }\n            if verified_open_override is not None\n            else None\n        )\n        rows = load_report_activity_rows(\n            start_date,\n            end_date,\n            conn=conn,\n            duration_overrides=duration_overrides,\n        )\n',
          )
          replace_once(
              "worktrace/services/report_projection_builder.py",
              '            interval_rows=reportable_rows,\n            unrecorded_gap_boundary_seconds=gap_threshold,\n        )\n',
              '            interval_rows=reportable_rows,\n            unrecorded_gap_boundary_seconds=gap_threshold,\n            effective_open_activity_id=(\n                int(verified_open_override.activity_id)\n                if verified_open_override is not None\n                else 0\n            ),\n        )\n',
          )
          replace_once(
              "worktrace/services/report_projection_builder.py",
              '    "ProjectionComputation",\n    "compute_projection",\n    "compute_projection_snapshot_revision",\n]',
              '    "ProjectionComputation",\n    "VerifiedOpenProjectionOverride",\n    "compute_effective_read_projection",\n    "compute_projection",\n    "compute_projection_snapshot_revision",\n]',
          )

          Path("worktrace/services/report_effective_projection_service.py").write_text(textwrap.dedent('''\
              """Verified request-local report structure over the durable projection."""

              from __future__ import annotations

              from collections.abc import Mapping, Sequence
              from typing import Any

              from .live_time_service import snapshot_seconds_for_date_range
              from .report_projection_builder import (
                  ProjectionComputation,
                  VerifiedOpenProjectionOverride,
                  compute_effective_read_projection,
              )


              _MUTATION_CAPABILITIES = (
                  "can_hide",
                  "can_copy",
                  "can_hide_activity",
                  "can_merge_previous",
                  "can_merge_next",
                  "can_split",
              )


              def build_effective_read_computation(
                  context,
                  report_date: str,
                  durable_entries: Sequence[Mapping[str, Any]],
              ) -> ProjectionComputation | None:
                  """Build as-of topology only from the PageReadContext verified owner."""

                  if (
                      context is None
                      or not bool(context.runtime_consistent)
                      or not bool(context.collection_live_eligible)
                  ):
                      return None
                  open_activity_id = context.verified_open_activity_id
                  if open_activity_id is None or int(open_activity_id) <= 0:
                      return None
                  runtime_snapshot = context.runtime_sample.snapshot
                  if not isinstance(runtime_snapshot, Mapping):
                      return None
                  try:
                      runtime_activity_id = int(
                          runtime_snapshot.get("persisted_activity_id") or 0
                      )
                      elapsed_seconds = max(
                          0,
                          int(runtime_snapshot.get("elapsed_seconds") or 0),
                      )
                  except (TypeError, ValueError):
                      return None
                  if runtime_activity_id != int(open_activity_id):
                      return None
                  if snapshot_seconds_for_date_range(
                      runtime_snapshot,
                      report_date,
                      report_date,
                  ) <= 0:
                      return None

                  computation = compute_effective_read_projection(
                      context.conn,
                      report_date,
                      report_date,
                      VerifiedOpenProjectionOverride(
                          activity_id=int(open_activity_id),
                          duration_seconds=elapsed_seconds,
                      ),
                  )
                  _mark_provisional_entries(computation, durable_entries)
                  return computation


              def _mark_provisional_entries(
                  computation: ProjectionComputation,
                  durable_entries: Sequence[Mapping[str, Any]],
              ) -> None:
                  durable_keys = {
                      str(entry.get("projection_instance_key") or "")
                      for entry in durable_entries
                  }
                  seen: set[int] = set()
                  for collection in (
                      computation.final_entries,
                      computation.final_sessions,
                  ):
                      for entry in collection:
                          if id(entry) in seen:
                              continue
                          seen.add(id(entry))
                          if str(entry.get("row_kind") or "project_session") != "project_session":
                              continue
                          key = str(entry.get("projection_instance_key") or "")
                          provisional = bool(entry.get("is_in_progress")) or key not in durable_keys
                          if not provisional:
                              continue
                          entry["read_provisional"] = True
                          entry["editable"] = False
                          entry["edit_disabled"] = True
                          for capability in _MUTATION_CAPABILITIES:
                              entry[capability] = False


              __all__ = ["build_effective_read_computation"]
          '''), encoding="utf-8")

          # The day provider stores only durable cross-request slots. Effective
          # projection is request-local and materialized from the same source version.
          replace_once(
              "worktrace/services/report_projection_provider.py",
              'def _get_via_page_context(context, report_date: str) -> DayProjection:\n    """Read path inside a page_read_scope — uses context\'s connection."""\n',
              'def _get_durable_via_page_context(context, report_date: str) -> DayProjection:\n    """Durable read path inside a page_read_scope — uses context\'s connection."""\n',
          )
          marker = '''\n\ndef _get_via_standalone(report_date: str) -> DayProjection:\n'''
          wrapper = '''\n\ndef _get_via_page_context(context, report_date: str) -> DayProjection:\n    """Return request-local effective topology over a cached durable day."""\n\n    cached = context.effective_day_projection_cache.get(report_date)\n    if cached is not None:\n        record_cache_hit(True)\n        return cached\n\n    durable = _get_durable_via_page_context(context, report_date)\n    from .report_effective_projection_service import build_effective_read_computation\n\n    computation = build_effective_read_computation(\n        context,\n        report_date,\n        durable.entries,\n    )\n    if computation is None:\n        effective = durable\n    else:\n        effective = materialize_day_projection(\n            computation,\n            durable.source_version,\n            report_date=report_date,\n        )\n    context.effective_day_projection_cache[report_date] = effective\n    return effective\n\n\ndef get_durable_day_projection(report_date: str) -> DayProjection:\n    """Return canonical durable structure without request-local live compaction."""\n\n    context = current_page_read_context()\n    if context is not None:\n        return _get_durable_via_page_context(context, report_date)\n    return _get_via_standalone(report_date)\n'''
          replace_once(
              "worktrace/services/report_projection_provider.py",
              marker,
              wrapper + marker,
          )
          replace_once(
              "worktrace/services/report_projection_provider.py",
              '    "get_day_projection",\n    "get_wait_timeout",\n',
              '    "get_day_projection",\n    "get_durable_day_projection",\n    "get_wait_timeout",\n',
          )

          # Statistics overlays the whole current day, not only the old live key.
          # This allows topology changes to subtract old closed groups and add the
          # effective as-of grouping without touching historical range caches.
          replace_once(
              "worktrace/services/statistics_realtime_summary.py",
              'from .report_projection_provider import get_day_projection\n',
              'from .report_projection_provider import (\n    get_day_projection,\n    get_durable_day_projection,\n)\n',
          )
          regex_once(
              "worktrace/services/statistics_realtime_summary.py",
              r'def build_statistics_realtime_overlay\(.*?\n\ndef merge_statistics_realtime_overlay\(',
              '''def _snapshot_from_day_projection(projection) -> ReportProjectionSnapshot:\n    entries = tuple(projection.entries)\n    final_sessions = tuple(\n        entry\n        for entry in entries\n        if str(entry.get("row_kind") or "project_session") == "project_session"\n    )\n    standalone = tuple(\n        entry\n        for entry in entries\n        if str(entry.get("row_kind") or "") == "standalone_status"\n    )\n    return ReportProjectionSnapshot(\n        start_date=str(projection.report_date),\n        end_date=str(projection.report_date),\n        base_sessions=final_sessions,\n        final_entries=entries,\n        final_sessions=final_sessions,\n        standalone_status_entries=standalone,\n        final_contributions=tuple(projection.contributions),\n        operation_diagnostics=tuple(projection.operation_diagnostics),\n        snapshot_revision=str(projection.snapshot_revision),\n    )\n\n\ndef build_statistics_realtime_overlay(\n    snapshot_revision: str,\n    start_date: str,\n    end_date: str,\n    *,\n    range_projection: StatisticsRangeProjection | None = None,\n) -> StatisticsRealtimeOverlay | None:\n    """Replace today's durable slice with one verified effective as-of day."""\n\n    del snapshot_revision, range_projection\n    context = current_page_read_context()\n    if context is None or not context.runtime_consistent:\n        return None\n\n    runtime_snapshot = context.runtime_sample.snapshot\n    if not isinstance(runtime_snapshot, Mapping):\n        return None\n    if snapshot_seconds_for_date_range(\n        runtime_snapshot,\n        start_date,\n        end_date,\n    ) <= 0:\n        return None\n\n    report_today = get_default_report_date()\n    if not (start_date <= report_today <= end_date):\n        return None\n\n    durable_day = get_durable_day_projection(report_today)\n    effective_day = get_day_projection(report_today)\n    before = _snapshot_from_day_projection(durable_day)\n    effective_snapshot = _snapshot_from_day_projection(effective_day)\n\n    from . import report_as_of_snapshot_service\n\n    as_of = report_as_of_snapshot_service.build_statistics_as_of_snapshot(\n        report_today,\n        report_today,\n        base_snapshot=effective_snapshot,\n    )\n    if (\n        as_of.live_target is None\n        and as_of.snapshot.snapshot_revision == effective_snapshot.snapshot_revision\n    ):\n        return None\n\n    return StatisticsRealtimeOverlay(\n        before_fragment=before,\n        after_fragment=as_of.snapshot,\n        runtime_snapshot=runtime_snapshot,\n        live_target=as_of.live_target,\n    )\n\n\ndef merge_statistics_realtime_overlay(''',
          )

          # View models expose the reason for fail-closed mutation affordances.
          replace_once(
              "worktrace/services/view_model_service.py",
              '        "is_in_progress": is_in_progress,\n        "contributes_to_totals": bool(session.get("contributes_to_totals", True)),\n',
              '        "is_in_progress": is_in_progress,\n        "read_provisional": bool(session.get("read_provisional")),\n        "contributes_to_totals": bool(session.get("contributes_to_totals", True)),\n',
          )

          # Architecture contract records the new single owner.
          replace_once(
              "docs/architecture.md",
              '| Verified page read snapshot | `PageReadContext` |\n| Row runtime overlay | `ActivityRowOverlay` |\n',
              '| Verified page read snapshot | `PageReadContext` |\n| Verified as-of report structure | `report_effective_projection_service` |\n| Row runtime overlay | `ActivityRowOverlay` |\n',
          )
          replace_once(
              "docs/architecture.md",
