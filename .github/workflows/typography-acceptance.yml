name: Typography Acceptance

on:
  pull_request:
    paths:
      - "worktrace/webview_ui/**"
      - "tests/fixtures/webview/typography_acceptance.html"
      - "tests/webview/test_typography_static_contract.py"
      - "scripts/render_typography_acceptance.py"
      - ".github/workflows/typography-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-edge-render:
    name: Windows Edge typography render
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render typography acceptance
        run: python scripts/render_typography_acceptance.py

      - name: Upload typography render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typography-acceptance
          path: test-results/typography
          if-no-files-found: error
          retention-days: 7
