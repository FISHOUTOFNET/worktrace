          )
          replace_one(
              'worktrace/runtime/app_runtime.py',
              '    def __init__(\n        self,\n        paths: "_Paths",\n        adapter: RuntimePlatformAdapter | None = None,\n    ) -> None:\n',
              '    def __init__(\n        self,\n        paths: "_Paths",\n        adapter: RuntimePlatformAdapter | None = None,\n        *,\n        launch_at_login_repair: LaunchAtLoginRepairCapability | None = None,\n    ) -> None:\n',
