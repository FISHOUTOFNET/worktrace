          runtime_path = ROOT / 'worktrace/runtime/app_runtime.py'
          runtime_text = runtime_path.read_text(encoding='utf-8')
          blocked_start = runtime_text.index('    def _blocked_worker_report(self) -> WorkerStartupReport:')
          startup_marker = runtime_text.index('        startup_started_at = time.monotonic()\n', blocked_start)
          replacement_block = dedent('''\
                  def _blocked_worker_report(self) -> WorkerStartupReport:
                      worker_specs = self._worker_specs_for_phase(WorkerStartPhase.AUTHORIZED)
                      statuses = {
                          name: _WorkerStartupStatus(
                              _WorkerStartupState.FAILED,
                              False,
