          startup_path.write_text(
              startup_text[:class_start] + replacement + new_all,
              encoding='utf-8',
          )

          # AppRuntime owns initialize-phase repair worker lifecycle without coupling
          # Task Scheduler health to Collector runtime health.
          replace_one(
              'worktrace/runtime/app_runtime.py',
              'from ..platforms.base import RuntimePlatformAdapter\nfrom ..platforms.windows_adapter import WindowsAdapter\n',
              'from ..platforms.base import RuntimePlatformAdapter\nfrom ..platforms.startup import LaunchAtLoginRepairCapability\nfrom ..platforms.windows_adapter import WindowsAdapter\n',
