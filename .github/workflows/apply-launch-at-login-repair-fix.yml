              'class RuntimePhase(str, Enum):\n    NEW = "new"\n    INITIALIZED = "initialized"\n    STARTING = "starting"\n    RUNNING = "running"\n    DEGRADED = "degraded"\n    RECOVERABLE_FAILURE = "recoverable_failure"\n    STOPPING = "stopping"\n    STOPPED = "stopped"\n    FAILED = "failed"\n\n\nclass WorkerStartPhase(str, Enum):\n    INITIALIZE = "initialize"\n    AUTHORIZED = "authorized"\n\n\n@dataclass(frozen=True)\nclass WorkerSpec:\n',
