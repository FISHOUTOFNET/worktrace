name: Apply launch-at-login repair fix

on:
  push:
    branches: [fix/tray-capability-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out current branch
        uses: actions/checkout@v6
        with:
          ref: fix/tray-capability-recovery
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-release.txt

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt -c constraints-release.txt

      - name: Apply architecture patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_one(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          write(
              'worktrace/platforms/startup.py',
              dedent('''\
              """Platform-neutral launch-at-login repair contracts."""
              from __future__ import annotations

              from enum import Enum
              from typing import Protocol, runtime_checkable


              class LaunchAtLoginRepairOutcome(str, Enum):
                  UNSUPPORTED = "unsupported"
                  DISABLED = "disabled"
                  CANONICAL = "canonical"
                  REPAIRED = "repaired"


              class LaunchAtLoginRepairError(RuntimeError):
                  """Classified repair failure safe for runtime retry policy."""

                  def __init__(
                      self,
                      code: str,
                      *,
                      retryable: bool,
                      native_codes: tuple[int, ...] = (),
                      operation: str = "repair",
                  ) -> None:
                      normalized = str(code or "launch_at_login_repair_failed").strip()
                      super().__init__(normalized)
                      self.code = normalized
                      self.retryable = bool(retryable)
                      self.native_codes = tuple(int(value) for value in native_codes)
                      self.operation = str(operation or "repair")


              @runtime_checkable
              class LaunchAtLoginRepairCapability(Protocol):
                  def repair_once(self) -> LaunchAtLoginRepairOutcome: ...


              __all__ = [
                  "LaunchAtLoginRepairCapability",
                  "LaunchAtLoginRepairError",
                  "LaunchAtLoginRepairOutcome",
              ]
              '''),
          )

          write(
              'worktrace/runtime/launch_at_login_repair.py',
              dedent('''\
              """Runtime-owned bounded launch-at-login repair worker."""
              from __future__ import annotations

              import logging
              import threading

              from ..platforms.startup import (
                  LaunchAtLoginRepairCapability,
                  LaunchAtLoginRepairError,
              )
              from ..worker_health import WorkerHealthReporter

              _MAX_ATTEMPTS = 5
              _INITIAL_DELAY_SECONDS = 1.0
              _MAX_DELAY_SECONDS = 8.0


              def run_launch_at_login_repair_worker(
                  stop_event: threading.Event,
                  repair: LaunchAtLoginRepairCapability,
                  *,
                  health: WorkerHealthReporter,
                  max_attempts: int = _MAX_ATTEMPTS,
                  initial_delay_seconds: float = _INITIAL_DELAY_SECONDS,
                  max_delay_seconds: float = _MAX_DELAY_SECONDS,
              ) -> None:
                  """Repair existing OS startup intent, then remain idle until shutdown."""

                  attempt_limit = max(1, int(max_attempts))
                  initial_delay = max(0.0, float(initial_delay_seconds))
                  max_delay = max(initial_delay, float(max_delay_seconds))
                  attempts = 0

                  while not stop_event.is_set():
                      attempts += 1
                      logging.info("launch_at_login repair attempt attempt=%s", attempts)
                      try:
                          outcome = repair.repair_once()
                      except LaunchAtLoginRepairError as exc:
                          health.failed(exc.code)
                          if exc.retryable and attempts < attempt_limit:
                              delay = min(
                                  max_delay,
                                  initial_delay * (2 ** min(attempts - 1, 30)),
                              )
                              logging.warning(
                                  "launch_at_login repair retry scheduled "
                                  "attempt=%s next_attempt=%s delay_seconds=%.1f "
                                  "code=%s operation=%s native_codes=%s",
                                  attempts,
                                  attempts + 1,
                                  delay,
                                  exc.code,
                                  exc.operation,
                                  list(exc.native_codes),
                                  exc_info=attempts == 1,
                              )
                              if stop_event.wait(delay):
                                  logging.info(
                                      "launch_at_login repair terminal "
                                      "outcome=cancelled attempts=%s",
                                      attempts,
                                  )
                                  return
                              continue

                          terminal = (
                              "retry_exhausted" if exc.retryable else "permanent_failure"
                          )
                          logging.error(
                              "launch_at_login repair terminal outcome=%s attempts=%s "
                              "code=%s operation=%s native_codes=%s",
                              terminal,
                              attempts,
                              exc.code,
                              exc.operation,
                              list(exc.native_codes),
                          )
                          stop_event.wait()
                          return
                      except Exception:
                          health.failed("launch_at_login_repair_unexpected_failure")
                          logging.exception(
                              "launch_at_login repair terminal "
                              "outcome=permanent_failure attempts=%s "
                              "code=launch_at_login_repair_unexpected_failure",
                              attempts,
                          )
                          stop_event.wait()
                          return

                      health.succeeded()
                      logging.info(
                          "launch_at_login repair terminal outcome=%s attempts=%s",
                          outcome.value,
                          attempts,
                      )
                      stop_event.wait()
                      return


              __all__ = ["run_launch_at_login_repair_worker"]
              '''),
          )

          # Windows platform layer: native error extraction/classification and shared owner lock.
          replace_one(
              'worktrace/platforms/windows_startup.py',
              'import ntpath\nimport sys\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Protocol\n',
              'import ntpath\nimport sys\nimport threading\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Protocol\n\nfrom .startup import (\n    LaunchAtLoginRepairError,\n    LaunchAtLoginRepairOutcome,\n)\n',
          )
          replace_one(
              'worktrace/platforms/windows_startup.py',
              '_TASK_NOT_FOUND_HRESULTS = {-2147024894, -2147024893}\n',
              '_TASK_NOT_FOUND_HRESULTS = {-2147024894, -2147024893}\n_TASK_ACCESS_DENIED_HRESULTS = {-2147024891}\n_TASK_TRANSIENT_HRESULTS = {\n    -2147418111,  # RPC_E_CALL_REJECTED\n    -2147417846,  # RPC_E_SERVERCALL_RETRYLATER\n    -2147216619,  # SCHED_E_SERVICE_NOT_RUNNING\n    -2147023174,  # HRESULT_FROM_WIN32(RPC_S_SERVER_UNAVAILABLE)\n    -2147023170,  # HRESULT_FROM_WIN32(RPC_S_CALL_FAILED)\n    -2147023169,  # HRESULT_FROM_WIN32(RPC_S_CALL_FAILED_DNE)\n    -2146959355,  # CO_E_SERVER_EXEC_FAILURE\n}\n',
          )
          replace_one(
              'worktrace/platforms/windows_startup.py',
              dedent('''\
              def _exception_contains_hresult(exc: BaseException, expected: set[int]) -> bool:
                  pending: list[object] = [getattr(exc, "hresult", None), getattr(exc, "args", ())]
                  while pending:
                      value = pending.pop()
                      if isinstance(value, int) and value in expected:
                          return True
                      if isinstance(value, (tuple, list)):
                          pending.extend(value)
                  return False
              '''),
              dedent('''\
              def _normalize_native_error_code(value: int) -> int:
                  if 0x80000000 <= value <= 0xFFFFFFFF:
                      return value - (1 << 32)
                  return value


              def _exception_native_error_codes(exc: BaseException) -> tuple[int, ...]:
                  pending: list[object] = [
                      getattr(exc, "hresult", None),
                      getattr(exc, "winerror", None),
                      getattr(exc, "args", ()),
                  ]
                  found: list[int] = []
                  while pending:
                      value = pending.pop()
                      if isinstance(value, bool):
                          continue
                      if isinstance(value, int):
                          normalized = _normalize_native_error_code(value)
                          if normalized not in found:
                              found.append(normalized)
                          continue
                      if isinstance(value, (tuple, list)):
                          pending.extend(value)
                  return tuple(found)


              def _exception_contains_hresult(exc: BaseException, expected: set[int]) -> bool:
                  return bool(set(_exception_native_error_codes(exc)).intersection(expected))


              def _classify_launch_at_login_failure(
                  exc: BaseException,
                  *,
                  operation: str,
              ) -> LaunchAtLoginRepairError:
                  native_codes = _exception_native_error_codes(exc)
                  native_set = set(native_codes)
                  if native_set.intersection(_TASK_TRANSIENT_HRESULTS):
                      code = "launch_at_login_task_scheduler_transient"
                      retryable = True
                  elif native_set.intersection(_TASK_ACCESS_DENIED_HRESULTS):
                      code = "launch_at_login_access_denied"
                      retryable = False
                  elif str(exc) == "launch_at_login_task_verification_failed":
                      code = "launch_at_login_task_verification_failed"
                      retryable = False
                  else:
                      code = "launch_at_login_repair_failed"
                      retryable = False
                  return LaunchAtLoginRepairError(
                      code,
                      retryable=retryable,
                      native_codes=native_codes,
                      operation=operation,
                  )
              '''),
          )

          startup_path = ROOT / 'worktrace/platforms/windows_startup.py'
          startup_text = startup_path.read_text(encoding='utf-8')
          class_start = startup_text.index('class WindowsStartupRegistration:')
          helper_start = startup_text.index('\n\ndef repair_launch_at_login_for_current_user')
          all_start = startup_text.index('\n\n__all__ = [', helper_start)
          replacement = dedent('''\
              class WindowsStartupRegistration:
                  """Authoritative current-user Task Scheduler launch-at-login registration."""

                  def __init__(
                      self,
                      executable_path: Path | None = None,
                      registry: StartupRegistry | None = None,
                      scheduler: StartupTaskScheduler | None = None,
                  ) -> None:
                      self._executable_path = (
                          Path(executable_path).resolve()
                          if executable_path is not None
                          else installed_executable_path()
                      )
                      self._registry = registry if registry is not None else WinregStartupRegistry()
                      self._scheduler = scheduler if scheduler is not None else WindowsTaskScheduler()
                      self._lock = threading.RLock()

                  @property
                  def supported(self) -> bool:
                      return self._executable_path is not None and sys.platform.startswith("win")

                  def expected_command(self) -> str:
                      with self._lock:
                          if self._executable_path is None:
                              raise RuntimeError("launch_at_login_unsupported")
                          return f'"{self._executable_path}" {BACKGROUND_ARGUMENT}'

                  def _task_spec(self) -> StartupTaskSpec:
                      if self._executable_path is None:
                          raise RuntimeError("launch_at_login_unsupported")
                      return StartupTaskSpec(
                          executable_path=self._executable_path,
                          arguments=BACKGROUND_ARGUMENT,
                          working_directory=self._executable_path.parent,
                      )

                  def _legacy_value(self) -> str | None:
                      return self._registry.read_run_value(RUN_VALUE_NAME)

                  def _legacy_is_enabled(self) -> bool:
                      value = self._legacy_value()
                      return isinstance(value, str) and bool(value.strip())

                  def _legacy_is_configured(self) -> bool:
                      try:
                          value = self._legacy_value()
                      except OSError:
                          return False
                      if not isinstance(value, str):
                          return False
                      return ntpath.normcase(value.strip()) == ntpath.normcase(
                          self.expected_command()
                      )

                  def is_canonical(self) -> bool:
                      with self._lock:
                          if not self.supported:
                              return False
                          try:
                              return self._scheduler.is_configured(
                                  TASK_NAME,
                                  self._task_spec(),
                              )
                          except Exception:
                              return False

                  def is_configured(self) -> bool:
                      with self._lock:
                          if not self.supported:
                              return False
                          if self.is_canonical():
                              return True
                          return self._legacy_is_configured()

                  def enable(self, executable_path: Path | None = None) -> None:
                      with self._lock:
                          if executable_path is not None:
                              self._executable_path = Path(executable_path).resolve()
                          if not self.supported:
                              raise RuntimeError("launch_at_login_unsupported")

                          spec = self._task_spec()
                          if not self._scheduler.is_configured(TASK_NAME, spec):
                              self._scheduler.register(TASK_NAME, spec)
                          if not self._scheduler.is_configured(TASK_NAME, spec):
                              raise OSError("launch_at_login_task_verification_failed")

                          # Delete the retired Run entry only after the scheduled task is
                          # verified, so registration failure cannot remove a working path.
                          self._registry.delete_run_value(RUN_VALUE_NAME)

                  def repair_if_needed(self) -> LaunchAtLoginRepairOutcome:
                      """Repair existing launch-at-login intent without creating new intent."""

                      with self._lock:
                          if not self.supported:
                              return LaunchAtLoginRepairOutcome.UNSUPPORTED

                          task_exists = self._scheduler.exists(TASK_NAME)
                          legacy_enabled = self._legacy_is_enabled()
                          if not task_exists and not legacy_enabled:
                              return LaunchAtLoginRepairOutcome.DISABLED

                          if self._scheduler.is_configured(TASK_NAME, self._task_spec()):
                              if legacy_enabled:
                                  self._registry.delete_run_value(RUN_VALUE_NAME)
                                  return LaunchAtLoginRepairOutcome.REPAIRED
                              return LaunchAtLoginRepairOutcome.CANONICAL

                          self.enable()
                          return LaunchAtLoginRepairOutcome.REPAIRED

                  def migrate_legacy_registration(self) -> None:
                      with self._lock:
                          if not self.supported:
                              raise RuntimeError("launch_at_login_unsupported")
                          self.repair_if_needed()

                  def disable(self) -> None:
                      with self._lock:
                          if not self.supported:
                              raise RuntimeError("launch_at_login_unsupported")

                          first_error: Exception | None = None
                          try:
                              self._scheduler.delete(TASK_NAME)
                          except Exception as exc:
                              first_error = exc
                          try:
                              self._registry.delete_run_value(RUN_VALUE_NAME)
                          except Exception as exc:
                              if first_error is None:
                                  first_error = exc
                          if first_error is not None:
                              raise first_error


              class WindowsLaunchAtLoginRepair:
                  """COM apartment adapter for one classified startup repair attempt."""

                  def __init__(self, registration: WindowsStartupRegistration) -> None:
                      self._registration = registration

                  def repair_once(self) -> LaunchAtLoginRepairOutcome:
                      if not self._registration.supported:
                          return LaunchAtLoginRepairOutcome.UNSUPPORTED

                      try:
                          import pythoncom

                          pythoncom.CoInitialize()
                      except Exception as exc:
                          raise _classify_launch_at_login_failure(
                              exc,
                              operation="com_initialize",
                          ) from exc

                      try:
                          try:
                              return self._registration.repair_if_needed()
                          except LaunchAtLoginRepairError:
                              raise
                          except Exception as exc:
                              raise _classify_launch_at_login_failure(
                                  exc,
                                  operation="repair",
                              ) from exc
                      finally:
                          pythoncom.CoUninitialize()
              ''')
          new_all = dedent('''\

              __all__ = [
                  "BACKGROUND_ARGUMENT",
                  "RUN_KEY",
                  "RUN_VALUE_NAME",
                  "TASK_NAME",
                  "StartupTaskSpec",
