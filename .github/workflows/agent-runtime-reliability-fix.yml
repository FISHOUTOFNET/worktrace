name: Apply runtime reliability follow-up

on:
  push:
    branches:
      - fix/runtime-reliability-followup

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-reliability-followup
          fetch-depth: 0

