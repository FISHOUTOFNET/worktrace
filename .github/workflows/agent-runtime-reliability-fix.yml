name: Apply runtime reliability follow-up

on:
  push:
    branches:
      - fix/runtime-reliability-followup

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-reliability-followup
          fetch-depth: 2

      - name: Recover and apply staged patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/agent-runtime-reliability-fix.yml > /tmp/staged-workflow.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/staged-workflow.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          raw = text[start:end]
          lines = []
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/runtime_fix.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/runtime_fix.py

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/agent-runtime-reliability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix runtime reliability follow-up"
          git push origin HEAD:fix/runtime-reliability-followup
