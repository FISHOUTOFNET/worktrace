name: Timeline governance apply

on:
  push:
    branches: [codex/timeline-js-governance]
    paths:
      - scripts/refactor_timeline_governance.py
      - .github/workflows/timeline-governance-apply.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'codex/timeline-js-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/timeline-js-governance
          fetch-depth: 0
      - name: Apply ownership refactor
        run: python scripts/refactor_timeline_governance.py
      - name: Sync WebView asset revisions
        run: python scripts/sync_webview_asset_revisions.py
      - name: Syntax check extracted JavaScript owners
        run: |
          node --check worktrace/webview_ui/js/timeline_presentation.js
          node --check worktrace/webview_ui/js/timeline_transient_ui.js
          node --check worktrace/webview_ui/js/timeline_editor_state.js
          node --check worktrace/webview_ui/js/timeline_fd_work.js
          node --check worktrace/webview_ui/js/timeline.js
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit generated refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorkTrace.spec worktrace/webview_ui/index_fd_work_v5.html worktrace/webview_ui/js tests/webview
          git commit -m "refactor: split timeline frontend ownership"
          git push origin HEAD:codex/timeline-js-governance
