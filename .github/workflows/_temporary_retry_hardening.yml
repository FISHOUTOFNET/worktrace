name: Temporary transient runtime hardening

on:
  push:
    branches:
      - fix/pre-release-ui-interaction-lifecycle
    paths:
      - .github/workflows/_temporary_retry_hardening.yml
      - scripts/_temporary_retry_hardening.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/pre-release-ui-interaction-lifecycle
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-release.txt

      - name: Apply hardening patch
        run: python scripts/_temporary_retry_hardening.py

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt -c constraints-release.txt

      - name: Compile changed Python
        run: python -m compileall -q worktrace tests/test_retry_state.py tests/test_collector_observation_absence.py tests/test_logging_config.py

      - name: Run focused regression tests
        run: >-
          python -m pytest -q
          tests/test_retry_state.py
          tests/test_collector_observation_absence.py
          tests/test_logging_config.py
          tests/test_windows_active_window_resilience.py
          tests/test_collector_health_continuity_contract.py
          tests/test_collector_failure_taxonomy.py
          tests/test_collector_operational_state.py
          tests/test_collector_supervisor.py
          --tb=short

      - name: Commit validated patch
        shell: pwsh
        run: |
          git rm scripts/_temporary_retry_hardening.py
          git add worktrace tests
          git diff --check --cached
          if (-not (git diff --cached --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: harden transient runtime observation and retries"
            git push origin HEAD:fix/pre-release-ui-interaction-lifecycle
          }
