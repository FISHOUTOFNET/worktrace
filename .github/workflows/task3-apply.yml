name: Task 3 patch bootstrap

on:
  push:
    branches:
      - fix/worker-retry-health-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source patch
        run: python scripts/task3_patch.py

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run focused regression suite
        run: >-
          python -m pytest -q
          tests/test_worker_retry_health_contract.py
          tests/test_worker_health_contract.py
          tests/test_database_worker_liveness_regressions.py
          tests/test_activity_inference_job_contracts.py
          tests/test_folder_index_refresh_policy.py

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worktrace tests
          git diff --cached --check
          git commit -m "fix: unify worker retry and health semantics"
          git push origin HEAD:${{ github.ref_name }}
