name: Repair effective live patcher

on:
  push:
    branches: [fix/pre-release-ui-interaction-lifecycle]
    paths:
      - .github/workflows/repair-effective-live-patcher.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pre-release-ui-interaction-lifecycle
          fetch-depth: 0
      - name: Fix architecture path and retrigger patcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-effective-live-projection-fix.yml')
          text = path.read_text(encoding='utf-8')
          old = 'docs/architecture.md'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 stale architecture paths, got {count}')
          path.write_text(text.replace(old, 'architecture.md'), encoding='utf-8')
          PY
          git diff --check
          git config user.name "worktrace-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/apply-effective-live-projection-fix.yml
          git commit -m "chore: fix effective projection patcher path"
          git push origin HEAD:fix/pre-release-ui-interaction-lifecycle
