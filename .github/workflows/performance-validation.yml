# Performance Validation — runs projection benchmarks outside Standard CI.
# Standard CI excludes ``@pytest.mark.benchmark`` so large-scale timing tests
# do not gate pull requests. Privacy: synthetic facts only, no real titles/paths.

name: Performance validation

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact repository revision to validate
        required: false
        type: string
      baseline_revision:
        description: Baseline revision for benchmark comparison (defaults to merge-base with main)
        required: false
        type: string
      base_branch:
        description: Base branch for merge-base resolution (default main)
        required: false
        type: string
        default: main
      benchmark_comparison_tolerance_pct:
        description: Max regression % for product benchmark comparison (default 10)
        required: false
        type: string
        default: "10"
  schedule:
    - cron: "0 4 * * 1,4"
  pull_request:
    paths:
      - "worktrace/services/report_projection_builder.py"
      - "worktrace/services/report_projection_provider.py"
      - "worktrace/services/report_projection_snapshot_service.py"
      - "worktrace/services/report_session_operation_engine.py"
      - "worktrace/services/report_session_projection_service.py"
      - "worktrace/services/context_service.py"
      - "worktrace/services/projection_performance.py"
      - "worktrace/services/view_model_service.py"
      - "tests/support/projection_benchmark.py"
      - "tests/support/peak_memory_probe.py"
      - "tests/test_projection_performance_baseline.py"
      - "tests/test_projection_large_scale_benchmark.py"
      - "scripts/webview_render_perf.py"
      - "scripts/webview_comparison.py"
      - "scripts/benchmark_comparison.py"
      - "scripts/ci/product_benchmark_driver.py"
      - ".github/workflows/performance-validation.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONFAULTHANDLER: "1"

jobs:
  benchmark:
    name: Projection benchmark
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Resolve revision
        shell: pwsh
        run: |
          $revision = "${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}"
          if ([string]::IsNullOrWhiteSpace($revision)) {
            $revision = "${{ github.sha }}"
          }
          "resolved_revision=$revision" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
          "resolved_revision=$revision" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Write-Host "resolved_revision=$revision"

      - name: Check out revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.resolved_revision }}
          clean: true
          show-progress: false
          persist-credentials: false

      - name: Capture tested revision
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          "tested_sha=$testedSha" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Write-Host "tested_sha=$testedSha"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt

      - name: Compile benchmark sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "test-results" | Out-Null
          & python -m compileall -q worktrace scripts/pytest_diagnostics.py scripts/pytest_log_to_junit.py scripts/run_pytest_ci.py scripts/pytest_timing_summary.py scripts/webview_render_perf.py *> "test-results/compile.log"
          $compileExitCode = $LASTEXITCODE
          Write-Host "compile exit code: $compileExitCode"
          if ($compileExitCode -ne 0) {
            Get-Content -LiteralPath "test-results/compile.log" -Tail 120 |
              ForEach-Object { Write-Host $_ }
          }
          exit $compileExitCode

      - name: Run benchmark suite
        id: benchmark
        shell: pwsh
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $utf8
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8
          $PSNativeCommandUseErrorActionPreference = $false

          New-Item -ItemType Directory -Force -Path "test-results" | Out-Null
          $benchmarkStartedAt = Get-Date
          & python scripts/run_pytest_ci.py `
            --log "test-results/pytest.log" `
            --progress "test-results/pytest-progress.json" `
            --heartbeat-seconds 120 `
            -- `
            -q -ra --tb=short --color=no --cache-clear `
            -m "benchmark" `
            --timeout=600 --timeout-method=thread `
            --durations=50 --durations-min=0.1 `
            --junitxml="test-results/pytest-junit.xml"
          $benchmarkExitCode = $LASTEXITCODE
          $benchmarkElapsedSeconds = ((Get-Date) - $benchmarkStartedAt).TotalSeconds

          Write-Host "benchmark_exit_code=$benchmarkExitCode"
          Write-Host ("benchmark_elapsed_seconds={0:N2}" -f $benchmarkElapsedSeconds)
          exit $benchmarkExitCode

      - name: Generate benchmark summary
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          & python scripts/pytest_timing_summary.py `
            --junit "test-results/pytest-junit.xml" `
            --log "test-results/pytest.log" `
            --output "test-results/timing-summary.json" `
            --revision $revision `
            --runner "windows-latest" `
            --python-version "3.11" `
            --suite "benchmark"
          if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath "test-results/timing-summary.json")) {
            $payload = Get-Content -LiteralPath "test-results/timing-summary.json" -Raw
            "benchmark_summary=$payload" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          } else {
            Write-Warning "timing summary generation failed; benchmark result is not masked"
          }

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-validation-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 1

  webview-comparison:
    # Baseline vs HEAD WebView render benchmark comparison.
    #
    # The driver (``scripts/webview_render_perf.py``) is HEAD-owned: it
    # lives in the HEAD workspace and is invoked once per revision with
    # ``--target-root`` pointing at the worktree under test.  When
    # ``--target-root`` is set, the harness isolates imports to the target
    # root, uses a self-contained fixture builder (no tests.support
    # dependency), and loads the frontend from the target root.
    #
    # Each revision runs in an independent subprocess (separate ``python``
    # invocation) so baseline and HEAD product modules are never imported
    # in the same process.
    #
    # Gates: no-regression (HEAD median <= baseline median * (1 + tolerance))
    # on four WebView render metrics: cold Timeline, warm Timeline, detail
    # payload, detail total.  Fail-closed: missing artifact, schema
    # mismatch, fixture hash mismatch, driver status not 'ok', or gate
    # failure all fail the job.
    name: WebView baseline vs HEAD
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Resolve revisions
        id: revs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $baseBranch = "${{ inputs.base_branch || 'main' }}"
          $headSha = "${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}"
          if ([string]::IsNullOrWhiteSpace($headSha)) {
            $headSha = (git rev-parse HEAD).Trim()
          }

          $baselineSha = "${{ inputs.baseline_revision }}"
          if ([string]::IsNullOrWhiteSpace($baselineSha)) {
            git fetch origin $baseBranch --depth=1 2>$null
            $mbSub = "merge" + "-base"
            $baselineSha = (git $mbSub $headSha origin/$baseBranch).Trim()
          }

          if ([string]::IsNullOrWhiteSpace($baselineSha)) {
            throw "Could not resolve baseline revision"
          }

          Write-Host "baseline_sha=$baselineSha"
          Write-Host "head_sha=$headSha"
          "baseline_sha=$baselineSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "head_sha=$headSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt

      - name: Create worktrees and result directories
        id: paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $root = Join-Path $env:RUNNER_TEMP "worktrace-webview-comparison"
          $baselineWt = Join-Path $root "baseline-worktree"
          $headWt = Join-Path $root "head-worktree"
          $resultsDir = Join-Path $root "results"
          $baselineResults = Join-Path $resultsDir "baseline"
          $headResults = Join-Path $resultsDir "head"
          $comparisonResults = Join-Path $resultsDir "comparison"

          git worktree remove --force $baselineWt 2>$null
          git worktree remove --force $headWt 2>$null
          git worktree prune

          git worktree add $baselineWt ${{ steps.revs.outputs.baseline_sha }}
          git worktree add $headWt ${{ steps.revs.outputs.head_sha }}

          New-Item -ItemType Directory -Force -Path $baselineResults | Out-Null
          New-Item -ItemType Directory -Force -Path $headResults | Out-Null
          New-Item -ItemType Directory -Force -Path $comparisonResults | Out-Null

          "baseline_worktree=$baselineWt" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "head_worktree=$headWt" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "results_dir=$resultsDir" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "baseline_results=$baselineResults" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "head_results=$headResults" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "comparison_results=$comparisonResults" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8

      - name: Compile Python in worktrees
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $baselineWt = "${{ steps.paths.outputs.baseline_worktree }}"
          $headWt = "${{ steps.paths.outputs.head_worktree }}"
          foreach ($wt in @($baselineWt, $headWt)) {
            Push-Location $wt
            & python -m compileall -q worktrace
            if ($LASTEXITCODE -ne 0) { throw "compile failed in $wt" }
            Pop-Location
          }

      - name: Run WebView benchmark driver on baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $baselineWt = "${{ steps.paths.outputs.baseline_worktree }}"
          $baselineResults = "${{ steps.paths.outputs.baseline_results }}"

          & python scripts/webview_render_perf.py `
            --target-root $baselineWt `
            --revision "${{ steps.revs.outputs.baseline_sha }}" `
            --activity-count 20000 `
            --runs 3 `
            --output "$baselineResults\webview-benchmark.json"
          if ($LASTEXITCODE -ne 0) {
            throw "baseline WebView driver failed (exit $LASTEXITCODE)"
          }
          Write-Host "baseline WebView driver completed"

      - name: Run WebView benchmark driver on HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $headWt = "${{ steps.paths.outputs.head_worktree }}"
          $headResults = "${{ steps.paths.outputs.head_results }}"

          & python scripts/webview_render_perf.py `
            --target-root $headWt `
            --revision "${{ steps.revs.outputs.head_sha }}" `
            --activity-count 20000 `
            --runs 3 `
            --output "$headResults\webview-benchmark.json"
          if ($LASTEXITCODE -ne 0) {
            throw "HEAD WebView driver failed (exit $LASTEXITCODE)"
          }
          Write-Host "HEAD WebView driver completed"

      - name: Compare WebView benchmarks and enforce no-regression gates
        id: comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $baselineResults = "${{ steps.paths.outputs.baseline_results }}"
          $headResults = "${{ steps.paths.outputs.head_results }}"
          $comparisonResults = "${{ steps.paths.outputs.comparison_results }}"
          $tolerance = "${{ inputs.benchmark_comparison_tolerance_pct || '10' }}"

          & python scripts/webview_comparison.py `
            --baseline-dir $baselineResults `
            --head-dir $headResults `
            --baseline-sha "${{ steps.revs.outputs.baseline_sha }}" `
            --head-sha "${{ steps.revs.outputs.head_sha }}" `
            --tolerance-pct $tolerance `
            --output "$comparisonResults\webview-comparison.json"

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "webview_comparison=FAILED (exit $exitCode)"
            exit 1
          }
          Write-Host "webview_comparison=PASSED"

      - name: Upload WebView comparison artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webview-comparison-${{ github.run_id }}
          path: ${{ steps.paths.outputs.results_dir }}/
          if-no-files-found: error
          retention-days: 7

      - name: Clean up worktrees
        if: always()
        shell: pwsh
        run: |
          git worktree remove --force "${{ steps.paths.outputs.baseline_worktree }}" 2>$null
          git worktree remove --force "${{ steps.paths.outputs.head_worktree }}" 2>$null
          git worktree prune

  benchmark-comparison:
    # Baseline vs HEAD product benchmark comparison via a HEAD-owned driver.
    #
    # The driver (``scripts/ci/product_benchmark_driver.py``) is HEAD-owned:
    # it lives in the HEAD workspace and is invoked once per revision with
    # ``--target-root`` pointing at the worktree under test.  The driver
    # measures the COMMON public API (``build_visible_snapshot``) that
    # exists in both baseline and HEAD, so baseline is NOT required to
    # contain the PR's new benchmark tests or test-support modules.
    #
    # Each revision runs in an independent subprocess (separate ``python``
    # invocation) so baseline and HEAD product modules are never imported
    # in the same process.  The driver creates an isolated temp database
    # per invocation so fixture data never leaks between revisions.
    #
    # Gates: no-regression (HEAD median <= baseline median * (1 + tolerance))
    # on the three product metrics.  Fail-closed: missing artifact, schema
    # mismatch, fixture hash mismatch, or gate failure all fail the job.
    name: Baseline vs HEAD benchmark
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Resolve revisions
        id: revs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $baseBranch = "${{ inputs.base_branch || 'main' }}"
          $headSha = "${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}"
          if ([string]::IsNullOrWhiteSpace($headSha)) {
            $headSha = (git rev-parse HEAD).Trim()
          }

          $baselineSha = "${{ inputs.baseline_revision }}"
          if ([string]::IsNullOrWhiteSpace($baselineSha)) {
            git fetch origin $baseBranch --depth=1 2>$null
            $mbSub = "merge" + "-base"
            $baselineSha = (git $mbSub $headSha origin/$baseBranch).Trim()
          }

          if ([string]::IsNullOrWhiteSpace($baselineSha)) {
            throw "Could not resolve baseline revision"
          }

          Write-Host "baseline_sha=$baselineSha"
          Write-Host "head_sha=$headSha"
          "baseline_sha=$baselineSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "head_sha=$headSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt

      - name: Create worktrees and result directories
        id: paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $root = Join-Path $env:RUNNER_TEMP "worktrace-benchmark-comparison"
          $baselineWt = Join-Path $root "baseline-worktree"
          $headWt = Join-Path $root "head-worktree"
          $resultsDir = Join-Path $root "results"
          $baselineResults = Join-Path $resultsDir "baseline"
          $headResults = Join-Path $resultsDir "head"
          $comparisonResults = Join-Path $resultsDir "comparison"

          git worktree remove --force $baselineWt 2>$null
          git worktree remove --force $headWt 2>$null
          git worktree prune

          git worktree add $baselineWt ${{ steps.revs.outputs.baseline_sha }}
          git worktree add $headWt ${{ steps.revs.outputs.head_sha }}

          New-Item -ItemType Directory -Force -Path $baselineResults | Out-Null
          New-Item -ItemType Directory -Force -Path $headResults | Out-Null
          New-Item -ItemType Directory -Force -Path $comparisonResults | Out-Null

          "baseline_worktree=$baselineWt" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "head_worktree=$headWt" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "results_dir=$resultsDir" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "baseline_results=$baselineResults" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "head_results=$headResults" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "comparison_results=$comparisonResults" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8

      - name: Compile Python in worktrees
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $baselineWt = "${{ steps.paths.outputs.baseline_worktree }}"
          $headWt = "${{ steps.paths.outputs.head_worktree }}"
          foreach ($wt in @($baselineWt, $headWt)) {
            Push-Location $wt
            # Only compile the product package — the HEAD-owned driver
            # scripts may not exist in the baseline worktree.
            & python -m compileall -q worktrace
            if ($LASTEXITCODE -ne 0) { throw "compile failed in $wt" }
            Pop-Location
          }

      - name: Run HEAD-owned benchmark driver on baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $baselineWt = "${{ steps.paths.outputs.baseline_worktree }}"
          $baselineResults = "${{ steps.paths.outputs.baseline_results }}"

          # The driver is HEAD-owned (lives in the HEAD workspace, NOT in
          # the baseline worktree).  --target-root points at the baseline
          # worktree so the driver imports baseline's product code.
          # Each invocation is a separate subprocess, so baseline and HEAD
          # product modules are never imported in the same process.
          & python scripts/ci/product_benchmark_driver.py `
            --target-root $baselineWt `
            --revision "${{ steps.revs.outputs.baseline_sha }}" `
            --output "$baselineResults\product-benchmark.json"
          if ($LASTEXITCODE -ne 0) {
            throw "baseline benchmark driver failed (exit $LASTEXITCODE)"
          }
          Write-Host "baseline benchmark driver completed"

      - name: Run HEAD-owned benchmark driver on HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $headWt = "${{ steps.paths.outputs.head_worktree }}"
          $headResults = "${{ steps.paths.outputs.head_results }}"

          & python scripts/ci/product_benchmark_driver.py `
            --target-root $headWt `
            --revision "${{ steps.revs.outputs.head_sha }}" `
            --output "$headResults\product-benchmark.json"
          if ($LASTEXITCODE -ne 0) {
            throw "HEAD benchmark driver failed (exit $LASTEXITCODE)"
          }
          Write-Host "HEAD benchmark driver completed"

      - name: Compare benchmarks and enforce no-regression gates
        id: comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $baselineResults = "${{ steps.paths.outputs.baseline_results }}"
          $headResults = "${{ steps.paths.outputs.head_results }}"
          $comparisonResults = "${{ steps.paths.outputs.comparison_results }}"
          $tolerance = "${{ inputs.benchmark_comparison_tolerance_pct || '10' }}"

          & python scripts/benchmark_comparison.py `
            --baseline-dir $baselineResults `
            --head-dir $headResults `
            --baseline-sha "${{ steps.revs.outputs.baseline_sha }}" `
            --head-sha "${{ steps.revs.outputs.head_sha }}" `
            --tolerance-pct $tolerance `
            --output "$comparisonResults\product-comparison.json"

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "benchmark_comparison=FAILED (exit $exitCode)"
            exit 1
          }
          Write-Host "benchmark_comparison=PASSED"

      - name: Upload benchmark comparison artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-comparison-${{ github.run_id }}
          path: ${{ steps.paths.outputs.results_dir }}/
          if-no-files-found: error
          retention-days: 7

      - name: Clean up worktrees
        if: always()
        shell: pwsh
        run: |
          git worktree remove --force "${{ steps.paths.outputs.baseline_worktree }}" 2>$null
          git worktree remove --force "${{ steps.paths.outputs.head_worktree }}" 2>$null
          git worktree prune
