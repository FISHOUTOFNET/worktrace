name: Apply FD Work retry readiness fix

on:
  push:
    branches:
      - fix/runtime-reliability-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-reliability-followup
      - name: Patch and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worktrace/integrations/fd_work/window_controller.py')
          text = path.read_text(encoding='utf-8')
          old = '''                if self._session_state in {"idle", "error"}:
                    self._begin_probe_generation_locked(explicit=explicit)
                    generation = self._navigation_generation
'''
          new = '''                if self._session_state in {"idle", "error"}:
                    page_loaded = self._loaded_generation is not None
                    self._begin_probe_generation_locked(explicit=explicit)
                    generation = self._navigation_generation
                    if page_loaded:
                        self._loaded_generation = generation
'''
          if text.count(old) != 1:
              raise SystemExit('FD Work retry readiness patch target not unique')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_fd_work_startup_probe_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          tests += '''\n\ndef test_loaded_window_retry_inherits_navigation_readiness():
    delayed = []
    controller, webview = _controller(delayed=delayed)
    controller.prepare_window_before_start(False)
    webview.window.events.loaded.fire()
    assert controller.get_status()["session_state"] == "ready"

    webview.window.url = "https://example.com/not-fd-work"
    webview.window.events.loaded.fire()
    assert controller.get_status()["error_code"] == "navigation_blocked"

    webview.window.url = _PageAdapter().business_url
    result = controller.prepare_window_before_start(False)
    assert result["ok"] is True
    assert delayed
    _delay, callback = delayed.pop(0)
    callback()
    assert controller.get_status()["session_state"] == "ready"
'''
          test_path.write_text(tests, encoding='utf-8')
          PY
          python -m pytest -q tests/test_fd_work_startup_probe_contract.py tests/test_fd_work_window_controller.py
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/agent-fd-retry-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix FD Work loaded-session retry readiness"
          git push origin HEAD:fix/runtime-reliability-followup
