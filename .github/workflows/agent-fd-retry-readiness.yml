name: Apply FD Work retry readiness fix

on:
  push:
    branches:
      - fix/runtime-reliability-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-reliability-followup
      - name: Patch and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('worktrace/integrations/fd_work/window_controller.py')
          text = path.read_text(encoding='utf-8')
          old = '                if self._session_state in {"idle", "error"}:\n                    self._begin_probe_generation_locked(explicit=explicit)\n                    generation = self._navigation_generation\n'
          new = '                if self._session_state in {"idle", "error"}:\n                    page_loaded = self._loaded_generation is not None\n                    self._begin_probe_generation_locked(explicit=explicit)\n                    generation = self._navigation_generation\n                    if page_loaded:\n                        self._loaded_generation = generation\n'
          if text.count(old) != 1:
              raise SystemExit('FD Work retry readiness patch target not unique')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          test_path = Path('tests/test_fd_work_startup_probe_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          addition = '\n\ndef test_loaded_window_retry_inherits_navigation_readiness():\n    delayed = []\n    controller, webview = _controller(delayed=delayed)\n    controller.prepare_window_before_start(False)\n    webview.window.events.loaded.fire()\n    assert controller.get_status()["session_state"] == "ready"\n\n    webview.window.url = "https://example.com/not-fd-work"\n    webview.window.events.loaded.fire()\n    assert controller.get_status()["error_code"] == "navigation_blocked"\n\n    webview.window.url = _PageAdapter().business_url\n    result = controller.prepare_window_before_start(False)\n    assert result["ok"] is True\n    assert delayed\n    _delay, callback = delayed.pop(0)\n    callback()\n    assert controller.get_status()["session_state"] == "ready"\n'
          test_path.write_text(tests + addition, encoding='utf-8')
          PY
          python -m pytest -q tests/test_fd_work_startup_probe_contract.py tests/test_fd_work_window_controller.py
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/agent-fd-retry-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix FD Work loaded-session retry readiness"
          git push origin HEAD:fix/runtime-reliability-followup
