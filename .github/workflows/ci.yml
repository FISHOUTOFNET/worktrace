name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Standard validation
    uses: ./.github/workflows/_validation.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      run_node_tests: true
      run_build_smoke: ${{ github.event_name == 'pull_request' }}

  timeline-harness-migration:
    name: Migrate timeline behavior harnesses
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/timeline-js-governance'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Detect pending harness migration
        id: pending
        shell: bash
        run: |
          if grep -q 'TIMELINE_MODULES' tests/webview/timeline_mutation_coordinator.test.js; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply harness migration
        if: steps.pending.outputs.apply == 'true'
        run: python scripts/migrate_timeline_test_harnesses.py
      - name: Run focused Timeline Node tests
        if: steps.pending.outputs.apply == 'true'
        run: >-
          node --test
          tests/webview/fd_work_fill_terminal_race.test.js
          tests/webview/fd_work_session_entry_policy.test.js
          tests/webview/fd_work_terminal_ui_contract.test.js
          tests/webview/page_transient_state.test.js
          tests/webview/timeline_mutation_coordinator.test.js
          tests/webview/timeline_project_scope.test.js
          tests/webview/timeline_refresh_ownership.test.js
          tests/webview/transient_context_lifecycle.test.js
          tests/webview/ui_redesign_behavior.test.js
      - name: Verify patch whitespace
        if: steps.pending.outputs.apply == 'true'
        run: git diff --check
      - name: Commit harness migration
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/webview
          git commit -m "test: load timeline owner modules in behavior harnesses"
          git push origin HEAD:${{ github.head_ref }}
