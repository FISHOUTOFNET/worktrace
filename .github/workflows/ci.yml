# FROZEN CI CONTRACT
# Business-test diagnostics are artifact-only; logs may show control metadata or heartbeats, but never failure details.
# Connector or log truncation and failure-group count changes are not reasons to modify this workflow or its contracts.
# Change only for action/runtime upgrades, security or validation scope, or reproducible artifact pipeline failures.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONFAULTHANDLER: "1"

jobs:
  python311:
    name: Standard validation / Python 3.11 full suite
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          show-progress: false
          persist-credentials: false

      - name: Capture tested revision
        id: revision
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          if ($testedSha -ne "${{ github.event.pull_request.head.sha || github.sha }}") {
            throw "Checked out $testedSha instead of requested revision ${{ github.event.pull_request.head.sha || github.sha }}"
          }
          "sha=$testedSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding UTF8
          "tested_sha=$testedSha" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Write-Host "tested_sha=$testedSha"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-release.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt -c constraints-release.txt

      - name: Record pywebview runtime
        shell: pwsh
        run: |
          $pywebviewVersion = python -c 'from importlib.metadata import version; print(version("pywebview"))'
          "pywebview_version=$pywebviewVersion" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Write-Host "pywebview_version=$pywebviewVersion"

      - name: Compile Python
        id: compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "test-results" | Out-Null
          & python -m compileall -q worktrace scripts/pytest_diagnostics.py scripts/pytest_log_to_junit.py scripts/run_pytest_ci.py *> "test-results/compile.log"
          $compileExitCode = $LASTEXITCODE
          Write-Host "compile exit code: $compileExitCode"
          if ($compileExitCode -ne 0) {
            Get-Content -LiteralPath "test-results/compile.log" -Tail 120 |
              ForEach-Object { Write-Host $_ }
          }
          exit $compileExitCode

      - name: Run Python tests
        id: pytest
        shell: pwsh
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $utf8
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8
          $PSNativeCommandUseErrorActionPreference = $false

          New-Item -ItemType Directory -Force -Path "test-results" | Out-Null
          $pytestStartedAt = Get-Date
          & python scripts/run_pytest_ci.py `
            --log "test-results/pytest.log" `
            --progress "test-results/pytest-progress.json" `
            --heartbeat-seconds 60 `
            -- `
            -q -ra --tb=short --color=no --cache-clear `
            -m "not benchmark" `
            --timeout=90 --timeout-method=thread `
            --durations=25 --durations-min=0.2 `
            --junitxml="test-results/pytest-junit.xml"
          $pytestExitCode = $LASTEXITCODE
          $pytestElapsedSeconds = ((Get-Date) - $pytestStartedAt).TotalSeconds

          Write-Host "pytest_exit_code=$pytestExitCode"
          Write-Host ("pytest_elapsed_seconds={0:N2}" -f $pytestElapsedSeconds)
          if ($pytestExitCode -ne 0) {
            Write-Host "pytest_failed=true diagnostics_source=workflow_artifact"
          }
          exit $pytestExitCode

      - name: Generate diagnostic artifact
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $artifactName = "validation-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}"
          if ("${{ steps.compile.outcome }}" -eq "failure") {
            & python scripts/pytest_diagnostics.py `
              --stage compile `
              --log "test-results/compile.log" `
              --output-dir "test-results" `
              --revision "${{ github.event.pull_request.head.sha || github.sha }}" `
              --artifact-name $artifactName
          }
          elseif ("${{ steps.pytest.outcome }}" -eq "failure") {
            if (-not (Test-Path -LiteralPath "test-results/pytest-junit.xml")) {
              Write-Host "junit_recovery=required"
              & python scripts/pytest_log_to_junit.py `
                --log "test-results/pytest.log" `
                --output "test-results/pytest-junit.xml" `
                --timeout-seconds 90
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Partial JUnit recovery failed; diagnostics will use the artifact log fallback"
              }
            }
            & python scripts/pytest_diagnostics.py `
              --stage pytest `
              --junit "test-results/pytest-junit.xml" `
              --log "test-results/pytest.log" `
              --output-dir "test-results" `
              --revision "${{ github.event.pull_request.head.sha || github.sha }}" `
              --artifact-name $artifactName
          }

          if (-not (Test-Path -LiteralPath "test-results/diagnostics.json")) {
            throw "Canonical diagnostics.json was not generated"
          }

      - name: Upload diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: validation-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  node:
    name: Standard validation / WebView Node behavior tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          show-progress: false
          persist-credentials: false

      - name: Capture tested revision
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          if ($testedSha -ne "${{ github.event.pull_request.head.sha || github.sha }}") {
            throw "Checked out $testedSha instead of requested revision ${{ github.event.pull_request.head.sha || github.sha }}"
          }
          "tested_sha=$testedSha" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Write-Host "tested_sha=$testedSha"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run WebView Node tests
        run: node --test tests/webview/*.test.js

      - name: Run FD Work Edge DOM fixture
        run: node scripts/run_fd_work_edge_fixture.mjs

      - name: Set up Python for typography acceptance
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Render typography acceptance
        id: typography
        run: python scripts/render_typography_acceptance.py

      - name: Upload typography render artifacts
        if: always() && steps.typography.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: typography-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/typography
          if-no-files-found: error
          retention-days: 7

  build:
    name: Standard validation / Windows package build smoke
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          show-progress: false
          persist-credentials: false

      - name: Capture tested revision
        shell: pwsh
        run: |
          $testedSha = (git rev-parse HEAD).Trim()
          if ($testedSha -ne "${{ github.event.pull_request.head.sha || github.sha }}") {
            throw "Checked out $testedSha instead of requested revision ${{ github.event.pull_request.head.sha || github.sha }}"
          }
          "tested_sha=$testedSha" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Write-Host "tested_sha=$testedSha"

      - name: Build Windows executable and installer
        uses: ./.github/actions/build-windows-package
