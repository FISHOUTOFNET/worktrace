name: Temporary folder-index retry import fix

on:
  push:
    branches:
      - fix/pre-release-ui-interaction-lifecycle
    paths:
      - .github/workflows/_temporary_import_fix.yml
      - scripts/_temporary_import_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pre-release-ui-interaction-lifecycle
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
      - name: Apply import fix
        run: python scripts/_temporary_import_fix.py
      - name: Validate import and compile
        run: |
          python -m compileall -q worktrace/services/folder_index_service.py
          python -c "import worktrace.services.folder_index_service as m; assert m.RetryEpisode"
      - name: Commit fix
        shell: pwsh
        run: |
          git rm scripts/_temporary_import_fix.py
          git add worktrace/services/folder_index_service.py
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep folder-index retry state runtime-owned"
          git push origin HEAD:fix/pre-release-ui-interaction-lifecycle
