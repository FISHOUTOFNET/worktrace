# corrected staging trigger
name: Apply launch-at-login repair fix v2

on:
  push:
    branches: [fix/tray-capability-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out current branch
        uses: actions/checkout@v6
        with:
          ref: fix/tray-capability-recovery
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-release.txt

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt -c constraints-release.txt

      - name: Apply corrected architecture patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-launch-at-login-repair-fix.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])

          doc_marker = '# Architecture contract records the auxiliary worker semantics explicitly.'
          script = script[: script.index(doc_marker)]
          script += '''\narch_path = ROOT / "architecture.md"\narch = arch_path.read_text(encoding="utf-8")\nneedle = "and they never create parallel worker threads."\nif arch.count(needle) != 1:\n    raise RuntimeError(f"architecture.md: expected one worker ownership anchor, found {arch.count(needle)}")\npos = arch.index(needle) + len(needle)\naddition = (\n    " Launch-at-login repair is an initialize-phase auxiliary worker: "\n    "`AppRuntime` owns its thread and shutdown, the worker owns only a bounded "\n    "retry episode, and Task Scheduler capability failure is reported in worker "\n    "health without degrading Collector/runtime health."\n)\narch_path.write_text(arch[:pos] + addition + arch[pos:], encoding="utf-8")\n'''
          exec(compile(script, '<launch-at-login-staging>', 'exec'), {})

          test_path = Path('tests/test_launch_at_login_repair_reliability.py')
          test_source = test_path.read_text(encoding='utf-8')
          old = 'class _Adapter:\n    def shutdown(self) -> None: pass\n'
          new = (
              'class _Adapter:\n'
              '    def run_clipboard_capture(self, *_args, **_kwargs) -> None: pass\n\n'
              '    def shutdown(self) -> None: pass\n'
          )
          if test_source.count(old) != 1:
              raise RuntimeError('repair reliability test adapter anchor mismatch')
          test_path.write_text(test_source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile patched Python
        shell: pwsh
        run: python -m compileall -q worktrace scripts tests/test_launch_at_login_repair_reliability.py

      - name: Run focused regression tests
        shell: pwsh
        run: |
          python -m pytest -q --tb=short `
            tests/test_windows_startup_self_heal.py `
            tests/test_windows_startup_registration.py `
            tests/test_launch_at_login_settings.py `
            tests/test_launch_at_login_repair_reliability.py `
            tests/test_runtime_ownership_convergence_contract.py `
            tests/test_runtime_architecture.py `
            tests/test_background_headless_startup.py `
            tests/test_webview_entry.py

      - name: Commit validated patch and remove staging workflows
        shell: bash
        run: |
          rm .github/workflows/apply-launch-at-login-repair-fix.yml
          rm .github/workflows/apply-launch-at-login-repair-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden launch-at-login self-repair"
          git push origin HEAD:fix/tray-capability-recovery
